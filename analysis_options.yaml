# Shared analyzer configuration for every package in this workspace.
# Individual packages include this file; they must not weaken it.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Reject implicit `dynamic` everywhere the analyzer allows it. A plugin
    # serialises everything across a method channel, which is exactly where
    # untyped values hide bugs.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing doc on a public member is a score-visible defect on pub.dev,
    # not a style preference.
    public_member_api_docs: warning
    invalid_annotation_target: error
    unawaited_futures: error
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    # ── Public API surface ────────────────────────────────────────────────
    - public_member_api_docs
    - always_declare_return_types
    - use_super_parameters
    - prefer_initializing_formals

    # ── Async correctness ─────────────────────────────────────────────────
    - unawaited_futures
    - avoid_void_async
    - await_only_futures

    # ── Immutability and const ────────────────────────────────────────────
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_locals
    - prefer_final_in_for_each

    # ── Correctness ───────────────────────────────────────────────────────
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - use_build_context_synchronously

    # ── Readability ───────────────────────────────────────────────────────
    - prefer_single_quotes
    - directives_ordering
    - sort_constructors_first
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_string_buffers
    - avoid_escaping_inner_quotes
    - join_return_with_assignment
