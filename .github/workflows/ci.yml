name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the toolchain. Keep in sync with the `flutter`
  # constraint declared in every package's pubspec.
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    name: Analyze & test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/glance_widget
            has_tests: true
          - package: packages/glance_widget_platform_interface
            has_tests: true
          - package: packages/glance_widget_android
            has_tests: true
          - package: packages/glance_widget_ios
            has_tests: true
          - package: packages/glance_widget/example
            has_tests: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # One resolve at the workspace root covers every member package.
      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none ${{ matrix.package }}

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --fatal-infos --fatal-warnings

      # Golden tests are excluded here and run in `goldens` instead. Flutter
      # rasterises the same widget tree slightly differently on different host
      # platforms, so one set of reference images can only be compared against
      # on the platform that produced them.
      - name: Test
        if: matrix.has_tests
        working-directory: ${{ matrix.package }}
        run: flutter test --reporter=expanded --exclude-tags golden

  publishable:
    name: Publish dry-run (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/glance_widget
          - packages/glance_widget_platform_interface
          - packages/glance_widget_android
          - packages/glance_widget_ios
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Dry-run publish
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run

      # `--dry-run` reports "0 warnings" without ever looking at what is in the
      # archive. glance_widget 1.0.1 passed it while shipping a 15 MB build
      # cache, so the contents are asserted explicitly.
      - name: Assert the archive carries no build output
        working-directory: ${{ matrix.package }}
        run: |
          listing="$(flutter pub publish --dry-run 2>&1)"
          if grep -qE '(^|/)(build|\.dart_tool)/|\.dill|\.log' <<<"$listing"; then
            echo "::error::Publish archive contains build output or logs:"
            grep -E '(^|/)(build|\.dart_tool)/|\.dill|\.log' <<<"$listing"
            exit 1
          fi
          echo "Archive is clean."

  android-build:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        working-directory: packages/glance_widget/example
        run: flutter build apk --debug
      - name: Build release APK (runs R8 against the plugin's consumer rules)
        working-directory: packages/glance_widget/example
        run: flutter build apk --release
      - name: Assert R8 kept the serialized models' field names
        working-directory: packages/glance_widget/example
        run: |
          # BackgroundUpdateConfig and PendingAction are stored as Gson JSON and
          # read back after an app update, so their field names are a storage
          # format. If R8 renames them the readers just return null and the
          # failure is silent -- background updates stop, queued taps vanish,
          # release only. consumer-rules.pro keeps them; this proves it still does.
          mapping=build/app/outputs/mapping/release/mapping.txt
          test -f "$mapping" || { echo "::error::no R8 mapping at $mapping -- did minification get turned off?"; exit 1; }
          status=0
          for class in BackgroundUpdateConfig PendingAction; do
            renamed=$(awk -v c="dev.glance.widget.android.$class ->" '
              index($0, c) == 1 { inside = 1; next }
              /^#/ { next }
              inside && /^[^ ]/ { inside = 0 }
              inside && /^    [a-zA-Z].* -> [a-z0-9]+$/ && !/\(/ { print }
            ' "$mapping")
            if [ -n "$renamed" ]; then
              echo "::error::R8 renamed fields on $class -- its stored JSON will not survive an app update:"
              echo "$renamed"
              status=1
            fi
          done
          exit $status

  android-unit-tests:
    name: Kotlin unit tests (glance_widget_android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The plugin has no Gradle wrapper of its own; it is built as a module of
      # whichever app includes it, so the example app's wrapper is the entry
      # point here too.
      - name: Run JVM unit tests
        working-directory: packages/glance_widget/example/android
        run: ./gradlew :glance_widget_android:testDebugUnitTest --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: packages/glance_widget/example/build/glance_widget_android/reports/tests/

  ios-build:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build without codesigning
        working-directory: packages/glance_widget/example
        run: flutter build ios --debug --no-codesign

  goldens:
    name: Golden tests (packages/glance_widget)
    # macOS, because that is where the checked-in reference images were
    # rendered. Comparing them on Linux would fail on antialiasing rather than
    # on anything a developer changed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Compare against the reference images
        working-directory: packages/glance_widget
        run: flutter test --reporter=expanded --tags golden
      - name: Upload the images that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/glance_widget/test/preview/failures/

  ios-unit-tests:
    name: Swift unit tests (glance_widget_ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Native iOS code is tested through the example app's XCTest target, the
      # way a Flutter plugin normally is -- the plugin's own SPM package depends
      # on FlutterFramework and cannot be built for the host platform.
      #
      # The script is what contributors run locally too, so the two cannot
      # drift. It also owns the two steps that are easy to get wrong by hand:
      # generating the Xcode configuration before xcodebuild, and discovering a
      # simulator instead of naming one.
      - name: Run the iOS unit tests
        run: ./tool/test_ios.sh
      - name: Type-check the widget extension templates
        run: ./tool/typecheck_templates.sh
