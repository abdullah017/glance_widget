name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for the toolchain. Keep in sync with the `flutter`
  # constraint declared in every package's pubspec.
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    name: Analyze & test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/glance_widget
            has_tests: true
          - package: packages/glance_widget_platform_interface
            has_tests: true
          - package: packages/glance_widget_android
            has_tests: true
          - package: packages/glance_widget_ios
            has_tests: true
          - package: packages/glance_widget/example
            has_tests: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # One resolve at the workspace root covers every member package.
      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none ${{ matrix.package }}

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        if: matrix.has_tests
        working-directory: ${{ matrix.package }}
        run: flutter test --reporter=expanded

  publishable:
    name: Publish dry-run (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/glance_widget
          - packages/glance_widget_platform_interface
          - packages/glance_widget_android
          - packages/glance_widget_ios
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Dry-run publish
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run

      # `--dry-run` reports "0 warnings" without ever looking at what is in the
      # archive. glance_widget 1.0.1 passed it while shipping a 15 MB build
      # cache, so the contents are asserted explicitly.
      - name: Assert the archive carries no build output
        working-directory: ${{ matrix.package }}
        run: |
          listing="$(flutter pub publish --dry-run 2>&1)"
          if grep -qE '(^|/)(build|\.dart_tool)/|\.dill|\.log' <<<"$listing"; then
            echo "::error::Publish archive contains build output or logs:"
            grep -E '(^|/)(build|\.dart_tool)/|\.dill|\.log' <<<"$listing"
            exit 1
          fi
          echo "Archive is clean."

  android-build:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        working-directory: packages/glance_widget/example
        run: flutter build apk --debug

  android-unit-tests:
    name: Kotlin unit tests (glance_widget_android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The plugin has no Gradle wrapper of its own; it is built as a module of
      # whichever app includes it, so the example app's wrapper is the entry
      # point here too.
      - name: Run JVM unit tests
        working-directory: packages/glance_widget/example/android
        run: ./gradlew :glance_widget_android:testDebugUnitTest --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: packages/glance_widget/example/build/glance_widget_android/reports/tests/

  ios-build:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build without codesigning
        working-directory: packages/glance_widget/example
        run: flutter build ios --debug --no-codesign

  ios-unit-tests:
    name: Swift unit tests (glance_widget_ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Native iOS code is tested through the example app's XCTest target, the
      # way a Flutter plugin normally is -- the plugin's own SPM package depends
      # on FlutterFramework and cannot be built for the host platform.
      - name: Generate the Xcode configuration
        working-directory: packages/glance_widget/example
        run: flutter build ios --config-only --no-codesign
      # The runner image decides which simulators exist, and that set changes
      # without notice -- a hardcoded device name turns an image update into a
      # red build on a green tree. Take whichever iPhone is actually installed.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; ds=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r in sorted(ds, reverse=True) for d in ds[r] if d["name"].startswith("iPhone")))')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run tests on a simulator
        working-directory: packages/glance_widget/example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Type-check the widget extension templates
        run: ./tool/typecheck_templates.sh
