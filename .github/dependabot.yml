version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pub
    directories:
      - /packages/glance_widget
      - /packages/glance_widget_platform_interface
      - /packages/glance_widget_android
      - /packages/glance_widget_ios
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /packages/glance_widget_android/android
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
