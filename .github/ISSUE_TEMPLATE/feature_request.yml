name: Feature request
description: Suggest a capability glance_widget should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build that the package makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch how it would look from the caller's side.
      render: dart

  - type: dropdown
    id: platform
    attributes:
      label: Platforms it applies to
      multiple: true
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
