# Robolectric simulates an Android runtime, and which one it simulates is
# independent of the compileSdk we build against. Left to default it picks the
# compileSdk -- 36 -- which it will only run on Java 21, while this module and
# CI are on Java 17 for the benefit of the apps that depend on it. Raising the
# toolchain to satisfy a test runner would be the tail wagging the dog.
#
# 34 is a deliberate choice rather than the newest that happens to work: it is
# above the API 31 boundary that the corner-radius and dynamic-colour paths
# branch on, so the layout tests exercise the modern path.
sdk=34
