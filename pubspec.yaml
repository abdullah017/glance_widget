# Workspace root. This is NOT a published package — it exists only to give the
# four glance_widget packages a single shared dependency resolution, so a
# sibling dependency resolves to the local source without pubspec_overrides.
name: glance_widget_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/glance_widget
  - packages/glance_widget_platform_interface
  - packages/glance_widget_android
  - packages/glance_widget_ios
  - packages/glance_widget/example
